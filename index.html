<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ball Escape">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Idle Ball Escape</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0f1a; color: #fff;
    font-family: -apple-system, system-ui, "SF Pro Display", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px);
    text-align: center; font-size: 48px; font-weight: 800; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
  #best {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 74px);
    text-align: center; font-size: 15px; font-weight: 700; color: #ffd166; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); transition: transform .2s;
  }
  #best.beat { color: #7dffb0; transform: scale(1.15); }
  #mode {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 98px);
    text-align: center; font-size: 12px; opacity: .5; pointer-events: none;
  }
  #ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; background: rgba(10,12,22,.86); transition: opacity .25s;
  }
  #ui.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: 34px; margin: 0 0 10px; text-align: center; font-weight: 800; }
  #msg { opacity: .85; margin: 0 0 22px; text-align: center; max-width: 330px; line-height: 1.5; font-size: 16px; }
  #newrec { color: #7dffb0; font-weight: 800; font-size: 20px; margin-bottom: 6px; min-height: 0; }
  button {
    font: inherit; font-size: 18px; font-weight: 700; color: #fff; width: 290px; max-width: 90vw;
    background: linear-gradient(135deg, #ff5e7e, #7b5cff); border: 0; border-radius: 18px;
    padding: 14px 24px; margin: 7px; box-shadow: 0 10px 28px rgba(0,0,0,.4); cursor: pointer;
  }
  button small { display: block; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 3px; }
  button.alt { background: #23263a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">0</div>
<div id="best"></div>
<div id="mode"></div>

<div id="ui">
  <h1>Idle Ball Escape</h1>
  <div id="newrec"></div>
  <p id="msg">Пролетай сквозь просветы в кольцах. Красные секции — смерть. Побей свой рекорд!</p>
  <div id="menu">
    <button id="bCtrl">С управлением<small id="rCtrl"></small></button>
    <button id="bAuto" class="alt">Авто-режим<small id="rAuto"></small></button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hud = document.getElementById('hud');
  const bestEl = document.getElementById('best');
  const modeLbl = document.getElementById('mode');
  const ui = document.getElementById('ui');
  const msg = document.getElementById('msg');
  const newrec = document.getElementById('newrec');
  const rCtrl = document.getElementById('rCtrl');
  const rAuto = document.getElementById('rAuto');

  const TAU = Math.PI * 2;
  const G = 1500;
  const JUMP = 640;
  const BALL_R = 14;
  const SPACING = 150;
  const BALL_SCREEN_Y = 0.62;
  const norm = a => { a = (a % TAU + TAU) % TAU; return a > Math.PI ? a - TAU : a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- рекорды (хранятся на устройстве) ----------
  const KEY = 'idle_ball_escape_bests_v1';
  let bests = { ctrl: 0, auto: 0 };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); bests.ctrl = +o.ctrl || 0; bests.auto = +o.auto || 0; }
  } catch (e) {}
  function saveBests() { try { localStorage.setItem(KEY, JSON.stringify(bests)); } catch (e) {} }
  function refreshMenuRecords() {
    rCtrl.textContent = '🏆 Рекорд: ' + bests.ctrl;
    rAuto.textContent = '🏆 Рекорд: ' + bests.auto;
  }
  refreshMenuRecords();

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let mode = 'ctrl', state = 'menu';
  let rot = 0, ball = { y: 0, vy: 0 }, rings = [], lastRingY = 0;
  let score = 0, startBest = 0, beatBest = false, time = 0, particles = [], shake = 0;
  let lastX = null;

  function makeRing(y, easy) {
    const gapW = clamp(1.0 - score * 0.012, 0.55, 1.0);
    const gapC = Math.random() * TAU;
    const solidStart = gapC + gapW / 2;
    const solidW = TAU - gapW;
    let dang = null;
    const chance = clamp(0.2 + score * 0.012, 0, 0.85);
    if (!easy && Math.random() < chance) {
      const w = Math.min(0.6 + Math.random() * 0.4, solidW * 0.5);
      const c = solidStart + solidW * (0.2 + Math.random() * 0.6);
      dang = { c, w };
    }
    return { y, gapC, gapW, dang, passed: false, color: `hsl(${(y * 0.3) % 360},80%,65%)` };
  }
  function addRing(easy = false) {
    lastRingY += SPACING;
    rings.push(makeRing(lastRingY, easy));
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 80 + Math.random() * 280;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
  }

  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function updateBestLabel() {
    const shown = Math.max(bests[mode], score);
    bestEl.textContent = (beatBest ? '🔥 Новый рекорд: ' : '🏆 Рекорд: ') + shown;
    bestEl.classList.toggle('beat', beatBest);
  }

  function start(m) {
    mode = m;
    rot = 0; ball = { y: 0, vy: 0 }; rings = []; lastRingY = 120;
    score = 0; time = 0; particles = []; shake = 0; lastX = null;
    startBest = bests[mode]; beatBest = false;
    for (let i = 0; i < 2; i++) addRing(true);
    while (lastRingY < 1200) addRing();
    state = 'play';
    ui.classList.add('hidden');
    hud.textContent = '0';
    updateBestLabel();
    modeLbl.textContent = mode === 'ctrl' ? 'тяни пальцем влево-вправо' : 'авто-режим';
  }

  function gameOver() {
    state = 'over';
    shake = 18;
    vibrate(80);
    burst(W / 2, H * BALL_SCREEN_Y, '#ff4d6d', 40);

    const isRecord = score > startBest && score > 0;
    if (isRecord) { bests[mode] = score; saveBests(); }
    refreshMenuRecords();

    newrec.textContent = isRecord ? '🎉 Новый рекорд!' : '';
    const left = bests[mode] - score;
    msg.innerHTML = `Счёт: <b>${score}</b><br>Рекорд: <b>${bests[mode]}</b>` +
      (!isRecord && left > 0 ? `<br><span style="opacity:.7">До рекорда ${left}</span>` : '');
    setTimeout(() => ui.classList.remove('hidden'), 500);
  }

  document.getElementById('bCtrl').onclick = () => start('ctrl');
  document.getElementById('bAuto').onclick = () => start('auto');

  cv.addEventListener('pointerdown', e => { lastX = e.clientX; });
  cv.addEventListener('pointermove', e => {
    if (state !== 'play' || mode !== 'ctrl' || lastX === null) return;
    rot += (e.clientX - lastX) * 0.011;
    lastX = e.clientX;
  });
  const endDrag = () => { lastX = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  function update(dt) {
    time += dt;

    if (mode === 'auto') {
      const nxt = rings.find(r => !r.passed);
      if (nxt) {
        const wobble = Math.sin(time * 2.7) * clamp(0.15 + score * 0.012, 0.15, 0.55);
        const target = Math.PI / 2 - nxt.gapC + wobble;
        const speed = 3 + Math.min(score * 0.08, 6);
        const delta = norm(target - rot);
        rot += clamp(delta, -speed * dt, speed * dt);
      }
    }

    ball.vy += G * dt;
    const prevY = ball.y;
    ball.y += ball.vy * dt;

    if (ball.vy > 0) {
      for (const r of rings) {
        if (r.passed) continue;
        if (prevY < r.y && ball.y >= r.y) {
          const a = Math.PI / 2 - rot;
          const inGap = Math.abs(norm(a - r.gapC)) < r.gapW / 2;
          const inDanger = r.dang && Math.abs(norm(a - r.dang.c)) < r.dang.w / 2;

          if (inGap) {
            r.passed = true;
            score++;
            hud.textContent = score;
            burst(W / 2, H * BALL_SCREEN_Y, r.color, 10);
            if (!beatBest && startBest > 0 && score > startBest) {
              beatBest = true; vibrate(40);
              burst(W / 2, H * BALL_SCREEN_Y, '#7dffb0', 30);
            }
            updateBestLabel();
          } else if (inDanger) {
            ball.y = r.y;
            gameOver();
            return;
          } else {
            ball.y = r.y;
            ball.vy = -JUMP;
            burst(W / 2, H * BALL_SCREEN_Y + BALL_R, '#ffffff', 6);
            shake = Math.max(shake, 3);
          }
          break;
        }
      }
    }

    while (lastRingY < ball.y + H * 1.4) addRing();
    rings = rings.filter(r => r.y > ball.y - H * 1.2);

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 500 * dt; p.life -= dt * 1.8;
    }
    particles = particles.filter(p => p.life > 0);
    shake *= Math.pow(0.001, dt);
  }

  function draw() {
    const cx = W / 2, by = H * BALL_SCREEN_Y;
    const rx = Math.min(W * 0.36, 260), ry = rx * 0.3;

    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#15122e'); bg.addColorStop(1, '#0a1a2a');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    ctx.lineCap = 'round';
    for (const r of rings) {
      const sy = by - (r.y - ball.y) - ry;
      if (sy < -200 || sy > H + 200) continue;

      const solidStart = r.gapC + r.gapW / 2 + rot;
      const solidW = TAU - r.gapW;

      ctx.beginPath();
      ctx.ellipse(cx, sy, rx, ry, 0, solidStart, solidStart + solidW);
      ctx.lineWidth = 16;
      ctx.strokeStyle = r.passed ? 'rgba(255,255,255,.12)' : r.color;
      ctx.shadowColor = r.color; ctx.shadowBlur = r.passed ? 0 : 12;
      ctx.stroke();

      if (r.dang) {
        ctx.beginPath();
        ctx.ellipse(cx, sy, rx, ry, 0, r.dang.c - r.dang.w / 2 + rot, r.dang.c + r.dang.w / 2 + rot);
        ctx.lineWidth = 18;
        ctx.strokeStyle = '#ff2e55';
        ctx.shadowColor = '#ff2e55'; ctx.shadowBlur = 18;
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life + 1, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const g = ctx.createRadialGradient(cx - 5, by - 5, 2, cx, by, BALL_R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#7fd8ff');
    ctx.shadowColor = '#7fd8ff'; ctx.shadowBlur = 20;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, by, BALL_R, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'over') {
      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt * 1.8; }
      particles = particles.filter(p => p.life > 0);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // Сцена для меню
  start('auto');
  state = 'menu';
  hud.textContent = '';
  bestEl.textContent = '';
  modeLbl.textContent = '';
  ui.classList.remove('hidden');
  requestAnimationFrame(frame);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
